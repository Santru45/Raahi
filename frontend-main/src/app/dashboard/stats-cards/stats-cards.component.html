<div class="row g-3 mb-4">
  @for (card of statCards; track card.key) {
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div
              class="d-inline-flex align-items-center justify-content-center rounded-3 p-2"
              style="background-color: var(--light-cyan)"
            >
              <i
                class="bi {{ card.icon }} fs-5"
                style="color: var(--bright-teal-blue)"
              ></i>
            </div>
          </div>
          <h4 class="fw-bold mb-1" style="color: var(--deep-twilight)">
            @if (card.key === "revenue") {
              {{ stats()[card.key] | currency: "INR" : "symbol" : "1.0-0" }}
            } @else {
              {{ getValue(card.key) | number }}
            }
          </h4>
          <small class="text-muted">{{ card.label }}</small>
        </div>
      </div>
    </div>
  }
</div>

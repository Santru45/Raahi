<div class="bg-white rounded-4 shadow p-4 mb-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-1" style="color: var(--deep-twilight);">Guest Reviews</h5>
      <div class="d-flex align-items-center gap-2 flex-wrap">

        <!-- total count badge -->
        <span class="badge rounded-pill px-3 py-1" style="background-color: var(--light-cyan);
                     color: var(--bright-teal-blue); font-size: 11px;">
          ✔ {{ totalReviews }} Verified Reviews
        </span>

        <!-- avg rating badge — only show if reviews exist -->
        <span *ngIf="avgRating > 0" class="badge rounded-pill px-3 py-1"
          style="background-color: #fef3c7; color: #92400e; font-size: 11px;">
          ⭐ {{ avgRating }} / 5 Average
        </span>

      </div>
    </div>

    <button *ngIf="canReview" class="btn btn-primary btn-sm px-3 py-2" style="border-radius: 20px;" (click)="render()">
      ✍️ Write a Review
    </button>
  </div>

  <hr class="mb-3" />

  <!-- Sort controls -->
  <div *ngIf="!isLoading && reviews.length > 0" class="mb-4">
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted small" style="font-weight: 500;">
        <i class="bi bi-funnel me-1"></i>Sort by:
      </span>
      <div class="btn-group shadow-sm" role="group" style="border-radius: 8px; overflow: hidden;">
        <button type="button" class="btn d-flex align-items-center gap-2 px-3 py-2" [ngClass]="{
            'btn-primary': sortBy === 'date',
            'btn-light border': sortBy !== 'date'
          }" (click)="toggleSort('date')" style="font-size: 13px; font-weight: 500; transition: all 0.2s;">
          <span>📅 Date</span>
          <span *ngIf="sortBy === 'date'" class="badge rounded-pill"
            [style.background-color]="sortOrder === 'desc' ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.3)'"
            style="font-size: 11px; padding: 2px 6px;">
            {{ sortOrder === 'desc' ? 'Newest' : 'Oldest' }}
          </span>
        </button>
        <button type="button" class="btn d-flex align-items-center gap-2 px-3 py-2" [ngClass]="{
            'btn-primary': sortBy === 'rating',
            'btn-light border': sortBy !== 'rating'
          }" (click)="toggleSort('rating')" style="font-size: 13px; font-weight: 500; transition: all 0.2s;">
          <span>⭐ Rating</span>
          <span *ngIf="sortBy === 'rating'" class="badge rounded-pill"
            [style.background-color]="sortOrder === 'desc' ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.3)'"
            style="font-size: 11px; padding: 2px 6px;">
            {{ sortOrder === 'desc' ? 'High to Low' : 'Low to High' }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border spinner-border-sm" style="color: var(--bright-teal-blue)"></div>
    <p class="text-muted small mt-2">Loading reviews...</p>
  </div>

  <!-- Reviews list -->
  <div *ngIf="!isLoading && displayedReviews.length > 0"
    style="max-height: 500px; overflow-y: auto; padding-right: 4px;">
    <app-review *ngFor="let review of displayedReviews" [review]="review"></app-review>
  </div>

  <!-- Empty state -->
  <ng-template #noReviews>
    <div *ngIf="!isLoading && reviews.length === 0" class="text-center py-4">
      <div style="font-size: 40px;">💬</div>
      <p class="fw-semibold mt-2 mb-0" style="color: var(--deep-twilight);">
        No reviews yet
      </p>
      <p class="text-muted small">Be the first to share your experience!</p>
    </div>
  </ng-template>

</div>
